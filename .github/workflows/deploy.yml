# Builds the web app and deploys it with the API to Cloudflare Workers on every
# push to main. Skips quietly until the Cloudflare secrets are set.
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID     required to deploy
#   SUPABASE_SERVICE_ROLE_KEY                       required for the API
#   AGENT_API_TOKEN                                 enables /api/agent
#   ANTHROPIC_API_KEY, WEB_RISK_API_KEY, RATE_LIMIT_SALT   optional
# Repository variables: VITE_CONTACT_EMAIL (optional), LLM_MODEL (optional).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.skip != 'true'
        run: npm ci
      - name: Build web app
        if: steps.cfg.outputs.skip != 'true'
        env:
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: npm run build
      - name: Deploy Worker
        if: steps.cfg.outputs.skip != 'true'
        run: |
          if [ -n "${{ vars.LLM_MODEL }}" ]; then
            npx wrangler deploy --var "LLM_MODEL:${{ vars.LLM_MODEL }}"
          else
            npx wrangler deploy
          fi
      - name: Upload Worker secrets
        if: steps.cfg.outputs.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEB_RISK_API_KEY: ${{ secrets.WEB_RISK_API_KEY }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
        run: |
          umask 077
          node -e '
            const names = ["SUPABASE_SERVICE_ROLE_KEY", "AGENT_API_TOKEN", "ANTHROPIC_API_KEY", "WEB_RISK_API_KEY", "RATE_LIMIT_SALT"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(".worker-secrets.json", JSON.stringify(set));
            console.log("uploading:", Object.keys(set).join(", ") || "(none)");
          '
          npx wrangler secret bulk .worker-secrets.json
          rm -f .worker-secrets.json
