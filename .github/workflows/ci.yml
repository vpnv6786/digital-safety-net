name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests and golden-set quality gate
        run: npm test
      - run: npm run build
      - name: Bundle the Cloudflare Worker (no deploy)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Install PostgreSQL if missing
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: Migrations and access-control tests
        run: ./scripts/test-db.sh
